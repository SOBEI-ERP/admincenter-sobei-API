spring:
  application:
    name: sobeidenuncia-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sobeidenuncia}?stringtype=unspecified}
    username: ${DB_USER:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    time-zone: America/Sao_Paulo

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
    clean-on-validation-error: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  mail:
    from: ${MAIL_FROM:congresso@sobei.org.br}
    from-name: ${MAIL_FROM_NAME:Congresso SOBEI 2026}
    enabled: ${MAIL_ENABLED:true}

  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Congresso SOBEI 2026 <onboarding@resend.dev>}
    api-url: ${RESEND_API_URL:https://api.resend.com/emails}

  jwt:
    secret: ${JWT_SECRET:sobeiprotocolosecretkey2026superseguracommaisde256bitsdelargura}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  r2:
    endpoint: ${R2_ENDPOINT:http://localhost:9000}
    access-key: ${R2_ACCESS_KEY_ID:minioadmin}
    secret-key: ${R2_SECRET_ACCESS_KEY:minioadmin}
    bucket-name: ${R2_BUCKET_NAME:sobei-uploads}

  cleanup:
    cron: ${CLEANUP_CRON:0 0 3 * * ?}

logging:
  level:
    root: INFO
    br.org.sobei.denuncias: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

  flyway:
    clean-disabled: false
    clean-on-validation-error: true

logging:
  level:
    br.org.sobei.denuncias: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    br.org.sobei.denuncias: INFO
    org.springframework.boot: INFO
    org.flywaydb: INFO
    org.hibernate: WARN
